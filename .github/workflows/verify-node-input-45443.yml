name: Verify node input replacement (fork)

on:
  push:
    branches:
      - ci/45443-node-input-verify

permissions:
  contents: read

jobs:
  focused-web:
    name: Workflow node update regression and type checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Web
        uses: ./.github/actions/setup-web
      - name: Focused unit tests
        run: vp test run --project unit app/components/workflow/nodes/knowledge-retrieval-v2/__tests__/use-config.spec.ts app/components/workflow/hooks/__tests__/use-node-data-update.spec.ts
      - name: Web types
        run: vp run type-check
      - name: Web lint (tsslint)
        run: vp run lint:tss
      - name: Format changed files
        run: vp fmt --check app/components/workflow/nodes/knowledge-retrieval-v2/__tests__/use-config.spec.ts app/components/workflow/hooks/__tests__/use-node-data-update.spec.ts app/components/workflow/nodes/_base/hooks/use-node-crud.ts app/components/workflow/hooks/use-node-data-update.ts
