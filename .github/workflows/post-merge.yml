name: Validate MySQL repository draft
permissions:
  contents: read
concurrency:
  group: validate-45035-mysql
  cancel-in-progress: true
jobs:
  mysql:
    name: API MySQL Integration Tests (3.13)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: /tmp/dify-storage
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: f7fb30d0002455b85d1dfc770fad777f9f9f8369
      - name: Setup UV and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
          python-version: '3.13'
          cache-dependency-glob: api/uv.lock
      - name: Check UV lockfile
        run: uv lock --project api --check
      - name: Install dependencies
        run: uv sync --project api --dev
      - name: Verify Docker is available
        run: docker info >/dev/null
      - name: Run existing MySQL repository regressions
        run: "mkdir -p test-results\nuv run --project api pytest \\\n  -p no:benchmark\
          \ \\\n  --timeout \"${PYTEST_TIMEOUT:-180}\" \\\n  -o 'addopts=-p no:opik\
          \ -p no:langsmith_plugin --import-mode=importlib' \\\n  -k mysql \\\n  --junitxml=test-results/mysql-integration.xml\
          \ \\\n  api/tests/integration_tests/repositories/human_input_v2/test_portable_delivery_binding_writes.py\
          \ \\\n  api/tests/integration_tests/repositories/human_input_v2/test_stale_im_sync_runs.py\n"
      - name: Upload MySQL test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: api-test-results-mysql-3.13
          path: test-results/mysql-integration.xml
          if-no-files-found: warn
          retention-days: 7
'on':
  workflow_dispatch: {}
run-name: MySQL draft f7fb30d000 (fork validation)
